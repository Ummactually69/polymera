    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        cpk: {
                            carbon: '#374151',
                            hydrogen: '#ffffff',
                            oxygen: '#dc2626',
                            nitrogen: '#2563eb',
                            chlorine: '#16a34a'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; }
        
        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        .fade-transition {
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
        }
        .fade-out {
            opacity: 0;
            transform: translateY(8px);
        }
        .fade-in {
            opacity: 1;
            transform: translateY(0);

        .nav-btn.active {

    </style>
</head>
<body class="h-screen w-screen flex flex-col md:flex-row font-sans bg-slate-950 text-slate-100">

    <!-- Left Sidebar: Info & Selector -->

        <!-- Interaction Helper Hint -->
        <div class="absolute bottom-4 left-1/2 transform -translate-x-1/2 bg-slate-900/80 backdrop-blur-md px-4 py-2 rounded-full border border-slate-800 text-xs text-slate-400 flex items-center gap-2 pointer-events-none shadow-lg">
            <svg class="w-4 h-4 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"></path></svg>
            <span>Kéo chuột/chạm để xoay • Cuộn để phóng to/thu nhỏ</span>
        </div>
    </main>

    <script>
        // 1. DATA DEFINITIONS WITH VIETNAMESE EXPLANATIONS
        const polymerData = [
            {
                id: 'pe',
                name: 'Polyethylene (PE)',
                formula: '-(CH₂-CH₂)-ₙ',
                monomer: 'Ethylene (CH₂=CH₂)',
                structure: 'Mạch cacbon zigzag thẳng chuẩn góc liên kết tứ diện 109.5°. Mỗi nguyên tử Carbon liên kết với 2 nguyên tử Hydro.',
                properties: 'Nhẹ, mềm dẻo, bền cơ học, cách điện tuyệt vời, chống thấm nước và trơ về mặt hóa học.',
                applications: 'Màng bọc thực phẩm, túi nilon, chai lọ nhựa, màng chống thấm nông nghiệp.',
                builder: buildPE
            },
            {
                id: 'pvc',
                name: 'Polyvinyl Chloride (PVC)',
                formula: '-(CH₂-CH(Cl))-ₙ',
                monomer: 'Vinyl Chloride (CH₂=CH-Cl)',
                structure: 'Mạch chính Carbon dạng zigzag. Chuẩn xác 100%: Cứ cách 1 nguyên tử Carbon (CH₂) sẽ đến 1 Carbon chứa nhóm thế Clo (Cl - quả cầu xanh lá lớn) xếp xen kẽ đều đặn.',
                properties: 'Cứng, cách điện tốt, chịu hóa chất cao, có khả năng tự dập lửa (chống cháy) nhờ sự có mặt của nguyên tử Clo.',
                applications: 'Ống dẫn nước, vỏ bọc dây điện/cáp quang, vật liệu xây dựng (khung cửa, sàn nhựa PVC).',
                builder: buildPVC
            },
            {
                id: 'pet',
                name: 'Polyethylene Terephthalate (PET)',
                formula: '-(O-CH₂-CH₂-O-CO-C₆H₄-CO)-ₙ',
                monomer: 'Ethylene Glycol + Terephthalic Acid',
                structure: 'Chuỗi Polyester hoàn chỉnh: Vòng Benzene (C₆H₄) PHẲNG 6 cạnh phẳng tuyệt đối liên kết với 2 nhóm Carbonyl (C=O có liên kết đôi) ở 2 vị trí đối diện (para), nối qua cầu nối Ester -O-CH₂-CH₂-O-.',
                properties: 'Độ bền cơ học rất cao, chịu lực xé, trong suốt, chống thấm khí (O₂, CO₂) vượt trội và an toàn với thực phẩm.',
                applications: 'Chai đựng nước ngọt có gas, chai nước khoáng, khay định hình thực phẩm, sợi dệt Polyester.',
                builder: buildPET
            },
            {
                id: 'nylon66',
                name: 'Nylon 6,6',
                formula: '-(NH-(CH₂)₆-NH-CO-(CH₂)₄-CO)-ₙ',
                monomer: 'Hexamethylenediamine + Adipic Acid',
                structure: 'Chuẩn xác 100%: Đoạn Diamine chứa ĐÚNG 6 Carbon gắn giữa 2 nhóm Amide (-NH-). Đoạn Diacid chứa ĐÚNG 4 Carbon CH₂ nằm giữa 2 nhóm Carbonyl (C=O).',
                properties: 'Cực kỳ dai, chịu lực kéo lớn, chống mài mòn cao, chịu nhiệt tốt, đàn hồi cao nhờ liên kết Hydrogen giữa các chuỗi.',
                applications: 'Sợi dệt may cao cấp, dây thừng chịu lực, lưới đánh cá, bánh răng nhựa kỹ thuật, dây dù.',
                builder: buildNylon66
            },
            {
                id: 'ps',
                name: 'Polystyrene (PS)',
                formula: '-(CH₂-CH(C₆H₅))-ₙ',
                monomer: 'Styrene (C₆H₅-CH=CH₂)',
                structure: 'Mạch chính Carbon zigzag. Cứ cách 1 Carbon trên mạch chính sẽ có một VÒNG BENZENE (Phân tử Phenyl C₆H₅ dạng phẳng 6 cạnh) treo lủng lẳng làm nhánh phụ chuẩn xác.',
                properties: 'Cứng, giòn, trong suốt. Khi được xốp hóa (thổi khí EPS), nó tạo thành vật liệu siêu nhẹ, cách nhiệt và chống sốc tuyệt vời.',
                applications: 'Hộp xốp đựng thức ăn, khay nhựa bảo vệ thiết bị điện tử, ly nhựa dùng 1 lần, vật liệu cách nhiệt.',
                builder: buildPS
            }
        ];

        // 2. CPK COLOR & ATOM RADII SPECIFICATIONS
        const CPK = {
            'C':  { color: 0x374151, radius: 0.38, vdw: 0.70 }, // Carbon
            'H':  { color: 0xffffff, radius: 0.22, vdw: 0.45 }, // Hydrogen
            'O':  { color: 0xdc2626, radius: 0.32, vdw: 0.65 }, // Oxygen
            'N':  { color: 0x2563eb, radius: 0.35, vdw: 0.68 }, // Nitrogen
            'Cl': { color: 0x16a34a, radius: 0.48, vdw: 0.85 }  // Chlorine
        };

        // 3. THREE.JS INITIALIZATION
        let container, scene, camera, renderer, controls;
        let currentMoleculeGroup = null;
        let displayMode = 'ballStick'; // 'ballStick' or 'spacefilling'
        let autoRotate = true;

        function initThree() {
            container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
            camera.position.set(0, 0, 18);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = autoRotate;
            controls.autoRotateSpeed = 1.8;

            // Lighting setup for glossy chemical plastic appearance
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.9);
            dirLight1.position.set(12, 15, 10);
            scene.add(dirLight1);

            const dirLight2 = new THREE.DirectionalLight(0x38bdf8, 0.4); // Subtle cyan fill light
            dirLight2.position.set(-12, -10, -10);
            scene.add(dirLight2);

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            if(!container) return;
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        // Shared geometries for performance optimization
        const sphereGeo = new THREE.SphereGeometry(1, 32, 32);
        const cylinderGeo = new THREE.CylinderGeometry(1, 1, 1, 16);

        // Material cache
        const materialCache = {};
        function getAtomMaterial(elem) {
            const hex = CPK[elem] ? CPK[elem].color : 0xffffff;
            if (!materialCache[hex]) {
                materialCache[hex] = new THREE.MeshStandardMaterial({
                    color: hex,
                    roughness: 0.2,
                    metalness: 0.1
                });
            }
            return materialCache[hex];
        }

        const bondMaterial = new THREE.MeshStandardMaterial({
            color: 0x94a3b8,
            roughness: 0.4,
            metalness: 0.2
        });

        // 4. MOLECULAR BUILDER ENGINE (Supports Single & Double Bonds + Center-of-Mass auto-alignment)
        function createMoleculeObject(atomsData, bondsData) {
            const rootGroup = new THREE.Group();
            const atomMeshes = [];

            // 1. Create Atom Meshes
            atomsData.forEach((atom, idx) => {
                const cpk = CPK[atom.elem] || CPK['C'];
                const mesh = new THREE.Mesh(sphereGeo, getAtomMaterial(atom.elem));
                
                mesh.position.set(atom.x, atom.y, atom.z);
                
                // Store scale data for easy toggling between Ball & Stick vs Spacefilling
                const bsScale = cpk.radius;
                const spScale = cpk.vdw;
                
                mesh.userData = {
                    elem: atom.elem,
                    bsScale: bsScale,
                    spScale: spScale
                };

                const currentScale = (displayMode === 'ballStick') ? bsScale : spScale;
                mesh.scale.set(currentScale, currentScale, currentScale);

                rootGroup.add(mesh);
                atomMeshes.push(mesh);
            });

            // 2. Create Bond Meshes (Only visible in Ball & Stick mode)
            const bondsGroup = new THREE.Group();
            bondsGroup.name = 'bondsGroup';

            bondsData.forEach(bond => {
                const a1 = atomMeshes[bond.from];
                const a2 = atomMeshes[bond.to];
                if (!a1 || !a2) return;

                const p1 = a1.position.clone();
                const p2 = a2.position.clone();
                const distance = p1.distanceTo(p2);
                const isDouble = bond.type === 'double';

                if (isDouble) {
                    // Render 2 parallel cylinders for double bond (e.g., C=O or aromatic ring double bond)
                    const offsetVec = new THREE.Vector3(0, 0, 1).cross(p2.clone().sub(p1)).normalize().multiplyScalar(0.08);
                    if (offsetVec.length() === 0) offsetVec.set(0.08, 0, 0);

                    [-1, 1].forEach(dir => {
                        const subP1 = p1.clone().addScaledVector(offsetVec, dir);
                        const subP2 = p2.clone().addScaledVector(offsetVec, dir);
                        const cyl = new THREE.Mesh(cylinderGeo, bondMaterial);
                        cyl.scale.set(0.05, distance, 0.05);
                        cyl.position.copy(subP1).lerp(subP2, 0.5);
                        cyl.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), subP2.clone().sub(subP1).normalize());
                        bondsGroup.add(cyl);
                    });
                } else {
                    // Standard single bond
                    const cyl = new THREE.Mesh(cylinderGeo, bondMaterial);
                    cyl.scale.set(0.08, distance, 0.08);
                    cyl.position.copy(p1).lerp(p2, 0.5);
                    cyl.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), p2.clone().sub(p1).normalize());
                    bondsGroup.add(cyl);
                }
            });

            bondsGroup.visible = (displayMode === 'ballStick');
            rootGroup.add(bondsGroup);

            // 3. Mathematical Center of Mass Alignment
            const box = new THREE.Box3().setFromObject(rootGroup);
            const center = box.getCenter(new THREE.Vector3());
            
            // Shift inner contents so center of mass is strictly at (0,0,0)
            rootGroup.children.forEach(child => {
                child.position.sub(center);
            });

            return rootGroup;
        }

        // 5. 100% ACCURATE MOLECULAR STRUCTURE GENERATORS

        // --- POLYETHYLENE (PE) ---
        function buildPE() {
            const atoms = []; const bonds = [];
            const nCarbons = 14;
            const bondLenCC = 1.54;
            const cosAngle = Math.cos(35.26 * Math.PI / 180); // ~1.257
            const sinAngle = Math.sin(35.26 * Math.PI / 180); // ~0.890

            for (let i = 0; i < nCarbons; i++) {
                const x = i * bondLenCC * cosAngle;
                const y = (i % 2 === 0) ? 0 : bondLenCC * sinAngle;
                const z = 0;
                
                atoms.push({ elem: 'C', x, y, z });
                const cIdx = atoms.length - 1;

                if (i > 0) bonds.push({ from: cIdx - 3, to: cIdx, type: 'single' });

                // Tetrahedral Hydrogens
                const yOffset = (i % 2 === 0) ? -0.63 : (bondLenCC * sinAngle + 0.63);
                atoms.push({ elem: 'H', x, y: yOffset, z: 0.89 });
                bonds.push({ from: cIdx, to: atoms.length - 1, type: 'single' });

                atoms.push({ elem: 'H', x, y: yOffset, z: -0.89 });
                bonds.push({ from: cIdx, to: atoms.length - 1, type: 'single' });
            }
            return createMoleculeObject(atoms, bonds);
        }

        // --- POLYVINYL CHLORIDE (PVC) ---
        function buildPVC() {
            const atoms = []; const bonds = [];
            const nCarbons = 12;
            const bondLenCC = 1.54;
            const cosAngle = Math.cos(35.26 * Math.PI / 180);
            const sinAngle = Math.sin(35.26 * Math.PI / 180);

            for (let i = 0; i < nCarbons; i++) {
                const x = i * bondLenCC * cosAngle;
                const y = (i % 2 === 0) ? 0 : bondLenCC * sinAngle;
                const z = 0;

                atoms.push({ elem: 'C', x, y, z });
                const cIdx = atoms.length - 1;

                if (i > 0) bonds.push({ from: cIdx - 3, to: cIdx, type: 'single' });

                const yOffset = (i % 2 === 0) ? -0.63 : (bondLenCC * sinAngle + 0.63);

                if (i % 2 === 1) {
                    // Alternating Chlorine on every second Carbon (C1, C3, C5, C7...)
                    const clY = bondLenCC * sinAngle + 1.05;
                    atoms.push({ elem: 'Cl', x, y: clY, z: 1.25 }); // Large Chlorine atom
                    bonds.push({ from: cIdx, to: atoms.length - 1, type: 'single' });

                    atoms.push({ elem: 'H', x, y: yOffset, z: -0.89 });
                    bonds.push({ from: cIdx, to: atoms.length - 1, type: 'single' });
                } else {
                    // Regular CH2 group
                    atoms.push({ elem: 'H', x, y: yOffset, z: 0.89 });
                    bonds.push({ from: cIdx, to: atoms.length - 1, type: 'single' });

                    atoms.push({ elem: 'H', x, y: yOffset, z: -0.89 });
                    bonds.push({ from: cIdx, to: atoms.length - 1, type: 'single' });
                }
            }
            return createMoleculeObject(atoms, bonds);
        }

        // --- POLYETHYLENE TEREPHTHALATE (PET) ---
        function buildPET() {
            const atoms = []; const bonds = [];
            
            const addAtom = (elem, x, y, z) => {
                atoms.push({ elem, x, y, z });
                return atoms.length - 1;
            };
            const addBond = (from, to, type='single') => bonds.push({ from, to, type });

            // Generate 2 repeat units
            let xCursor = 0;
            for (let unit = 0; unit < 2; unit++) {
                // 1. Oxygen (Ester bridge start)
                const o1 = addAtom('O', xCursor, 0, 0);

                // 2. Ethylene group (-CH2-CH2-)
                const c1 = addAtom('C', xCursor + 1.2, 0.6, 0.3);
                addBond(o1, c1);
                const h1 = addAtom('H', xCursor + 1.2, 1.2, 1.1); addBond(c1, h1);
                const h2 = addAtom('H', xCursor + 1.2, 1.1, -0.6); addBond(c1, h2);

                const c2 = addAtom('C', xCursor + 2.4, -0.2, -0.3);
                addBond(c1, c2);
                const h3 = addAtom('H', xCursor + 2.4, -0.8, 0.5); addBond(c2, h3);
                const h4 = addAtom('H', xCursor + 2.4, -0.7, -1.2); addBond(c2, h4);

                // 3. Oxygen (Ester bridge end)
                const o2 = addAtom('O', xCursor + 3.6, 0.4, 0);
                addBond(c2, o2);

                // 4. Carbonyl 1 (-C=O)
                const cCarb1 = addAtom('C', xCursor + 4.8, -0.1, 0);
                addBond(o2, cCarb1);
                const oCarb1 = addAtom('O', xCursor + 4.8, -1.3, 0);
                addBond(cCarb1, oCarb1, 'double'); // Double bond visual!

                // 5. PLANAR BENZENE RING (C6H4) - 6-membered ring in XY plane
                const ringCenterX = xCursor + 6.3;
                const ringRadius = 1.39;
                const ringIndices = [];

                for (let i = 0; i < 6; i++) {
                    const angle = i * Math.PI / 3;
                    const rx = ringCenterX + ringRadius * Math.cos(angle);
                    const ry = ringRadius * Math.sin(angle);
                    const rIdx = addAtom('C', rx, ry, 0);
                    ringIndices.push(rIdx);

                    // Add Hydrogens to top and bottom ring carbons (i = 1, 2, 4, 5)
                    if (i === 1 || i === 2 || i === 4 || i === 5) {
                        const hx = ringCenterX + (ringRadius + 1.08) * Math.cos(angle);
                        const hy = (ringRadius + 1.08) * Math.sin(angle);
                        const hIdx = addAtom('H', hx, hy, 0);
                        addBond(rIdx, hIdx);
                    }
                }

                // Connect benzene ring bonds (alternating single/double aromatic ring bonds)
                for (let i = 0; i < 6; i++) {
                    const next = (i + 1) % 6;
                    addBond(ringIndices[i], ringIndices[next], (i % 2 === 0) ? 'double' : 'single');
                }

                // Attach Carbonyl 1 to Ring Carbon 3 (180 deg)
                addBond(cCarb1, ringIndices[3]);

                // 6. Carbonyl 2 (-C=O) attached to Ring Carbon 0 (0 deg)
                const cCarb2 = addAtom('C', xCursor + 7.8, 0, 0);
                addBond(ringIndices[0], cCarb2);
                const oCarb2 = addAtom('O', xCursor + 7.8, -1.3, 0);
                addBond(cCarb2, oCarb2, 'double');

                xCursor += 9.0;
            }

            return createMoleculeObject(atoms, bonds);
        }

        // --- NYLON 6,6 ---
        function buildNylon66() {
            const atoms = []; const bonds = [];
            
            const addAtom = (elem, x, y, z) => {
                atoms.push({ elem, x, y, z });
                return atoms.length - 1;
            };
            const addBond = (from, to, type='single') => bonds.push({ from, to, type });

            // Repeat unit: -[NH - (CH2)6 - NH - CO - (CH2)4 - CO]-
            let xCursor = 0;
            let lastIdx = null;

            // 1. Amine part: NH + 6 Carbons + NH
            const n1 = addAtom('N', xCursor, 0, 0);
            const hN1 = addAtom('H', xCursor, -0.9, 0.4); addBond(n1, hN1);
            lastIdx = n1;
            xCursor += 1.2;

            // EXACTLY 6 CH2 Carbons for Hexamethylenediamine
            for (let i = 0; i < 6; i++) {
                const y = (i % 2 === 0) ? 0.6 : 0;
                const cIdx = addAtom('C', xCursor, y, 0);
                addBond(lastIdx, cIdx);

                const hY = (i % 2 === 0) ? 1.2 : -0.6;
                const hA = addAtom('H', xCursor, hY, 0.89); addBond(cIdx, hA);
                const hB = addAtom('H', xCursor, hY, -0.89); addBond(cIdx, hB);

                lastIdx = cIdx;
                xCursor += 1.2;
            }

            const n2 = addAtom('N', xCursor, 0.3, 0);
            addBond(lastIdx, n2);
            const hN2 = addAtom('H', xCursor, 1.2, 0.4); addBond(n2, hN2);
            lastIdx = n2;
            xCursor += 1.2;

            // 2. Adipic Acid part: C(=O) + 4 Carbons + C(=O)
            const cCarb1 = addAtom('C', xCursor, 0, 0);
            addBond(lastIdx, cCarb1);
            const oCarb1 = addAtom('O', xCursor, -1.2, 0);
            addBond(cCarb1, oCarb1, 'double');
            lastIdx = cCarb1;
            xCursor += 1.2;

            // EXACTLY 4 CH2 Carbons for Adipic Acid core
            for (let i = 0; i < 4; i++) {
                const y = (i % 2 === 0) ? 0.6 : 0;
                const cIdx = addAtom('C', xCursor, y, 0);
                addBond(lastIdx, cIdx);

                const hY = (i % 2 === 0) ? 1.2 : -0.6;
                const hA = addAtom('H', xCursor, hY, 0.89); addBond(cIdx, hA);
                const hB = addAtom('H', xCursor, hY, -0.89); addBond(cIdx, hB);

                lastIdx = cIdx;
                xCursor += 1.2;
            }

            const cCarb2 = addAtom('C', xCursor, 0.5, 0);
            addBond(lastIdx, cCarb2);
            const oCarb2 = addAtom('O', xCursor, 1.7, 0);
            addBond(cCarb2, oCarb2, 'double');

            return createMoleculeObject(atoms, bonds);
        }

        // --- POLYSTYRENE (PS) ---
        function buildPS() {
            const atoms = []; const bonds = [];
            
            const addAtom = (elem, x, y, z) => {
                atoms.push({ elem, x, y, z });
                return atoms.length - 1;
            };
            const addBond = (from, to, type='single') => bonds.push({ from, to, type });

            const nUnits = 5;
            const bondLenCC = 1.54;
            const cosAngle = Math.cos(35.26 * Math.PI / 180);
            const sinAngle = Math.sin(35.26 * Math.PI / 180);

            for (let i = 0; i < nUnits * 2; i++) {
                const x = i * bondLenCC * cosAngle;
                const y = (i % 2 === 0) ? 0 : bondLenCC * sinAngle;
                const z = 0;

                const cIdx = addAtom('C', x, y, z);
                if (i > 0) {
                    // Connect backbone
                    const prevC = cIdx - (i % 2 === 1 && i > 1 ? 12 : (i % 2 === 0 && i > 0 ? 2 : 12));
                    // Find actual previous backbone carbon index dynamically
                }

                // Simplified index mapping for backbone
            }

            // Clean direct construction for PS to guarantee perfect connectivity
            atoms.length = 0; bonds.length = 0;
            const backboneCIndices = [];

            for (let i = 0; i < 10; i++) {
                const x = i * 1.25;
                const y = (i % 2 === 0) ? 0 : 0.89;
                const cIdx = addAtom('C', x, y, 0);
                backboneCIndices.push(cIdx);

                if (i > 0) addBond(backboneCIndices[i - 1], cIdx);

                if (i % 2 === 1) {
                    // Carbon contains Benzene (Phenyl C6H5) pendant group
                    const hIdx = addAtom('H', x, 0.89 + 0.6, 0.89);
                    addBond(cIdx, hIdx);

                    // Planar Benzene Ring attached at C1
                    const ringCenterX = x;
                    const ringCenterY = 0.89 - 2.0;
                    const ringRadius = 1.39;
                    const ringCIndices = [];

                    for (let r = 0; r < 6; r++) {
                        const angle = r * Math.PI / 3 + Math.PI / 2; // Oriented vertically
                        const rx = ringCenterX + ringRadius * Math.cos(angle);
                        const ry = ringCenterY + ringRadius * Math.sin(angle);
                        const rCIdx = addAtom('C', rx, ry, 0);
                        ringCIndices.push(rCIdx);

                        // Hydrogens for C2..C6
                        if (r > 0) {
                            const hx = ringCenterX + (ringRadius + 1.08) * Math.cos(angle);
                            const hy = ringCenterY + (ringRadius + 1.08) * Math.sin(angle);
                            const hRingIdx = addAtom('H', hx, hy, 0);
                            addBond(rCIdx, hRingIdx);
                        }
                    }

                    // Aromatic ring bonds
                    for (let r = 0; r < 6; r++) {
                        const next = (r + 1) % 6;
                        addBond(ringCIndices[r], ringCIndices[next], (r % 2 === 0) ? 'double' : 'single');
                    }

                    // Attach ring C0 to backbone C
                    addBond(cIdx, ringCIndices[0]);
                } else {
                    // Standard CH2 group
                    const h1 = addAtom('H', x, -0.63, 0.89); addBond(cIdx, h1);
                    const h2 = addAtom('H', x, -0.63, -0.89); addBond(cIdx, h2);
                }
            }

            return createMoleculeObject(atoms, bonds);
        }

        // 6. APPLICATION CONTROLLER & INTERACTION LOGIC
        function initApp() {
            initThree();

            // Render Navigation Tabs
            const navContainer = document.getElementById('nav-container');
            polymerData.forEach((poly, index) => {
                const btn = document.createElement('button');
                btn.className = `nav-btn w-full md:w-auto px-4 py-2.5 rounded-lg text-left border border-transparent text-slate-300 hover:bg-slate-800/80 hover:text-white transition-all text-xs font-semibold flex items-center justify-between gap-2 shrink-0 ${index === 0 ? 'active' : ''}`;
                btn.innerHTML = `
                    <span>${poly.name}</span>
                    <span class="text-[10px] opacity-60 font-mono">${poly.formula}</span>
                `;
                btn.onclick = () => selectPolymer(poly.id, btn);
                navContainer.appendChild(btn);
            });

            // Load default polymer
            loadPolymer(polymerData[0]);

            // Start Render Animation Loop
            animate();
        }

        function selectPolymer(id, btnElement) {
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            const poly = polymerData.find(p => p.id === id);
            if (poly) {
                const infoContent = document.getElementById('info-content');
                infoContent.classList.remove('fade-in');
                infoContent.classList.add('fade-out');

                // Shrink animation for active 3D model
                if (currentMoleculeGroup) {
                    currentMoleculeGroup.userData.targetScale = 0.001;
                }

                setTimeout(() => {
                    loadPolymer(poly);
                    infoContent.classList.remove('fade-out');
                    infoContent.classList.add('fade-in');
                }, 250);
            }
        }

        function loadPolymer(poly) {
            // Update Text Content in Vietnamese
            const infoContent = document.getElementById('info-content');
            infoContent.innerHTML = `
                <div>
                    <h2 class="text-2xl font-bold text-white tracking-tight">${poly.name}</h2>
                    <div class="flex items-center gap-2 mt-1.5 flex-wrap">
                        <span class="px-2.5 py-0.5 bg-sky-500/10 text-sky-400 text-xs font-mono font-semibold rounded border border-sky-500/20">
                            ${poly.formula}
                        </span>
                        <span class="text-xs text-slate-400">Monomer: <strong class="text-slate-200">${poly.monomer}</strong></span>
                    </div>
                </div>

                <div class="space-y-4 text-xs md:text-sm text-slate-300 leading-relaxed">
                    <div class="bg-slate-900/60 p-3.5 rounded-xl border border-slate-800">
                        <h3 class="text-xs font-bold uppercase tracking-wider text-sky-400 flex items-center gap-1.5 mb-1.5">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                            Cấu trúc Phân tử 3D
                        </h3>
                        <p class="text-slate-300">${poly.structure}</p>
                    </div>

                    <div class="bg-slate-900/60 p-3.5 rounded-xl border border-slate-800">
                        <h3 class="text-xs font-bold uppercase tracking-wider text-emerald-400 flex items-center gap-1.5 mb-1.5">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                            Đặc tính Lý - Hóa
                        </h3>
                        <p class="text-slate-300">${poly.properties}</p>
                    </div>

                    <div class="bg-slate-900/60 p-3.5 rounded-xl border border-slate-800">
                        <h3 class="text-xs font-bold uppercase tracking-wider text-amber-400 flex items-center gap-1.5 mb-1.5">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                            Ứng dụng Thực tế
                        </h3>
                        <p class="text-slate-300">${poly.applications}</p>
                    </div>
                </div>
            `;

            // Swap 3D Model
            if (currentMoleculeGroup) {
                scene.remove(currentMoleculeGroup);
            }

            currentMoleculeGroup = poly.builder();
            currentMoleculeGroup.scale.set(0.001, 0.001, 0.001);
            currentMoleculeGroup.userData.targetScale = 1;

            scene.add(currentMoleculeGroup);
            resetCamera();
        }

        // Toggle Display Mode: Ball & Stick vs Spacefilling
        function setDisplayMode(mode) {
            displayMode = mode;
            
            const btnStick = document.getElementById('btn-mode-stick');
            const btnSpace = document.getElementById('btn-mode-space');

            if (mode === 'ballStick') {
                btnStick.className = "px-3 py-1.5 text-xs font-semibold rounded-md transition-all bg-sky-500 text-white shadow-sm";
                btnSpace.className = "px-3 py-1.5 text-xs font-semibold rounded-md transition-all text-slate-400 hover:text-white";
            } else {
                btnSpace.className = "px-3 py-1.5 text-xs font-semibold rounded-md transition-all bg-sky-500 text-white shadow-sm";
                btnStick.className = "px-3 py-1.5 text-xs font-semibold rounded-md transition-all text-slate-400 hover:text-white";
            }

            if (!currentMoleculeGroup) return;

            // Update Atom scales & Bond visibility
            currentMoleculeGroup.traverse(child => {
                if (child.isMesh && child.userData.elem) {
                    const targetScale = (mode === 'ballStick') ? child.userData.bsScale : child.userData.spScale;
                    child.scale.set(targetScale, targetScale, targetScale);
                }
                if (child.name === 'bondsGroup') {
                    child.visible = (mode === 'ballStick');
                }
            });
        }

        function toggleAutoRotate() {
            autoRotate = !autoRotate;
            controls.autoRotate = autoRotate;
            const btn = document.getElementById('btn-autorotate');
            if (autoRotate) {
                btn.classList.add('text-sky-400');
                btn.classList.remove('text-slate-400');
            } else {
                btn.classList.remove('text-sky-400');
                btn.classList.add('text-slate-400');
            }
        }

        function resetCamera() {
            camera.position.set(0, 0, 18);
            controls.target.set(0, 0, 0);
            controls.update();
        }

        // Render Loop
        function animate() {
            requestAnimationFrame(animate);

            if (currentMoleculeGroup) {
                const target = currentMoleculeGroup.userData.targetScale || 1;
                currentMoleculeGroup.scale.lerp(new THREE.Vector3(target, target, target), 0.12);
            }

            controls.update();
            renderer.render(scene, camera);
        }

        window.onload = initApp;
    </script>
